appId: com.designagent.desktop
productName: DesignAgentDesktop
copyright: Copyright © 2026 Design Agent Workspace
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
extraResources:
  - from: resources/skills
    to: skills
  - from: resources/presets
    to: presets
  - from: resources/regulations
    to: regulations
  - from: resources/mcp
    to: mcp
  - from: resources/runtime
    to: runtime
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# 自动更新的发布源：electron-updater 从这个仓库的 Release 读 latest.yml
publish:
  provider: github
  owner: xiaohai1314-sys
  repo: design-agent
  releaseType: release
